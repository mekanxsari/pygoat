name: Vulnerability 2 - DEBUG mode check

# Builds PyGoat from this repository and compares the app with debug mode
# on (state before the patch) and off (state after the patch).
on:
  push:
    branches: [vuln2-debug-mode]
  workflow_dispatch:

jobs:
  debug_check:
    name: Before/after check of DEBUG mode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image from the repository
        run: docker build -f Dockerfile -t pygoat-local:latest .

      - name: Prepare report directory
        run: |
          mkdir -p reports
          chmod 777 reports

      - name: Run checks (before = DJANGO_DEBUG=True, after = default)
        run: |
          for MODE in before after; do
            if [ "$MODE" = "before" ]; then DBG="True"; else DBG="False"; fi

            docker run --rm -d --name pygoat -p 8000:8000 \
              -e DJANGO_SECRET_KEY=ci-test-key-only \
              -e DJANGO_DEBUG=$DBG \
              pygoat-local:latest \
              sh -c "python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:8000 pygoat.wsgi"

            for i in $(seq 1 60); do
              curl -s -o /dev/null http://127.0.0.1:8000/login/ && break
              sleep 2
            done

            check_page () {
              if grep -q "DEBUG = True" "$2"; then DP="yes"; else DP="no"; fi
              if grep -q -i "traceback" "$2"; then TB="yes"; else TB="no"; fi
              echo "| $1 | $3 | $DP | $TB | $(wc -c < "$2") |" >> $GITHUB_STEP_SUMMARY
            }

            echo "## $MODE the patch (DJANGO_DEBUG=$DBG)" >> $GITHUB_STEP_SUMMARY
            echo "| Request | HTTP code | Debug page? | Python traceback? | Page size (bytes) |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

            # 404 error page
            OUT="reports/${MODE}_404_page.html"
            CODE=$(curl -s -o "$OUT" -w "%{http_code}" http://127.0.0.1:8000/this-page-does-not-exist/)
            check_page "GET /this-page-does-not-exist/" "$OUT" "$CODE"

            # 500 error page (the same request that ZAP reported as an application error)
            curl -s -c cookies.txt -o /dev/null http://127.0.0.1:8000/accounts/login/
            TOKEN=$(grep csrftoken cookies.txt | awk '{print $7}')
            OUT="reports/${MODE}_500_page.html"
            CODE=$(curl -s -b cookies.txt -o "$OUT" -w "%{http_code}" \
              -X POST -d "csrfmiddlewaretoken=$TOKEN" \
              http://127.0.0.1:8000/accounts/google/login/)
            check_page "POST /accounts/google/login/" "$OUT" "$CODE"
            echo "" >> $GITHUB_STEP_SUMMARY

            docker run --network host -v "$PWD/reports:/zap/wrk/:rw" \
              ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py -t http://127.0.0.1:8000 -r zap-$MODE.html -I || true

            docker stop pygoat
            sleep 3
          done

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuln2-debug-reports
          path: reports/
