name: CI

on: [push]

jobs:
  dast_scan:
    name: Deploy PyGoat and Run DAST
    runs-on: ubuntu-latest

    steps:
      - name: Deploy PyGoat
        run: |
          docker pull pygoat/pygoat:latest
          docker run --rm -d -p 8000:8000 pygoat/pygoat:latest

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "PyGoat is ready!"
              exit 0
            fi
            echo "Waiting for PyGoat..."
            sleep 2
          done
          echo "PyGoat failed to start"
          exit 1

      - name: Prepare report directory
        run: |
          mkdir -p zap-output
          chmod 777 zap-output

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --network host \
            -v "$PWD/zap-output:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -r zap-report.html \
            -I

      - name: Upload DAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: zap-output/zap-report.html
          if-no-files-found: warn

  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-findings
          path: bandit-report.json

  image_scan:
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f Dockerfile -t mytestapp:latest .

      - name: Docker Scout Scan
        uses: docker/scout-action@v1.15.1
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          command: quickview,cves
          only-severities: critical,high
          sarif-file: scout-report.sarif
          exit-code: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-scout-findings
          path: scout-report.sarif
