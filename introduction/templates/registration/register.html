{% extends "introduction/base.html" %}
{% block content %} 

{% load crispy_forms_tags %}

<div class="csp-flex-wrap">
<div class="card mx-auto csp-register-card">
<div class="conatiner border border-info rounded">

	<!--Register--> 
	<div class="container py-5">
		<h1 class="csp-dark-text">Register</h1>
		<form method="POST">
			{% csrf_token %}
			{{ register_form|crispy }}                    
			<button class="btn btn-primary" type="submit">Register</button>
		</form>
		<br>
		<p class="csp-dark-text">If you already have an account, <a href="/login" class="csp-login-link">Login</a> instead.</p>
	</div>
</div>
</div>
</div>

{% endblock %}
