{% extends "introduction/base.html" %}
{% block content %}
{% load crispy_forms_tags %}
{% load socialaccount %}
<div class="csp-flex-wrap">
 <div class="card mx-auto csp-login-card">
<div class="conatiner border border-info rounded">
    <h2 align="center" class="csp-login-heading">Login</h2>
    
    <form method="post">
        <div class="login-form">
        {% csrf_token %}
        {{form|crispy}}
        </div>
        <div>
         </p>
        </div>
        <div class="text-center">
        <button type="submit" class="btn btn-info csp-login-submit">Login</button>
        </div>
    </form>
    <div align="center" id="o-auth" class="csp-auth-actions">
        
        <a href="/register" class="btn btn-primary csp-auth-button">Register</a>

        <form method="post" action="/accounts/google/login/">
             {% csrf_token %} 
            <button type="submit" class="btn btn-primary csp-auth-button">
                Login with Google
            </button>
        </form>
    </div>

</div>
</div>
</div>
{% endblock %}
